name: marrow

services:
  rsshub:
    # use this image for full compatibility with sites that might be tricky to scrape diygod/rsshub:chromium-bundled(I think)
    image: diygod/rsshub:latest
    container_name: rsshub
    restart: unless-stopped
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: ${RSSHUB_NODE_ENV:-production}
      CACHE_TYPE: ${RSSHUB_CACHE_TYPE:-memory}
      NPM_CONFIG_LOGLEVEL: ${RSSHUB_NPM_LOGLEVEL:-error}
      REQUEST_TIMEOUT: ${RSSHUB_REQUEST_TIMEOUT:-10000}
      REQUEST_RETRY: ${RSSHUB_REQUEST_RETRY:-2}
    networks:
      - marrow
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://rsshub:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Add resource limits to prevent memory issues
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
  api:
    build:
      context: ../
      dockerfile: deployments/Dockerfile
    container_name: marrow-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      # Persistent SQLite storage (survives container recreation)
      - ../data:/app/data
      # Hot-reloadable feed sources definition (read-only)
      - ../configs:/app/configs:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:-/app/data/marrow.db}
      RSSHUB_BASE_URL: ${RSSHUB_BASE_URL:-http://rsshub:1200}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      APP_PORT: ${APP_PORT:-8080}
      CONFIG_PATH: ${CONFIG_PATH:-/app/configs}
    depends_on:
      - rsshub
    networks:
      - marrow

volumes:
  marrow_data:
    name: marrow_data

networks:
  marrow:
    name: marrow
    driver: bridge